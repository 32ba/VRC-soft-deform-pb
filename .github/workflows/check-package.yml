name: Check package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test release packaging
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Build release artifacts
        run: python .github/scripts/build_release.py --repository "$GITHUB_REPOSITORY"

      - name: Upload checked artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-package
          path: Artifacts~/
          if-no-files-found: error
          retention-days: 7
